name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Verify (typecheck + dashboard parse guard + unit tests)
        run: bun run verify

      - name: Full test suite
        run: bun test

      - name: Conformance (ordered event-sequence fixtures)
        run: bun run conformance

      - name: Conformance results are deterministic and leave no diff
        run: |
          cp conformance/results.json conformance/results.before.json
          bun run conformance
          cmp conformance/results.json conformance/results.before.json
          rm conformance/results.before.json
          git diff --exit-code -- conformance/results.json

      - name: Keep working tree clean after conformance
        run: |
          git restore -- conformance/results.json
          git diff --exit-code
